<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Blueprint — Design cloud infrastructure visually. Ship Terraform instantly.</title>
    <meta
      name="description"
      content="Free, open-source blueprint editor that keeps your architecture diagram and your Terraform code in perfect sync. AWS, Azure, and GCP. Runs entirely in your browser."
    />
    <link rel="canonical" href="https://pedromenuzzi.github.io/cloud-infra-blueprint/" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cloud Blueprint" />
    <meta property="og:title" content="Cloud Blueprint — Design cloud infrastructure visually. Ship Terraform instantly." />
    <meta
      property="og:description"
      content="Free, open-source visual Terraform editor: the diagram and the code stay in sync. AWS, Azure and GCP — runs entirely in your browser."
    />
    <meta property="og:url" content="https://pedromenuzzi.github.io/cloud-infra-blueprint/" />
    <meta property="og:image" content="https://pedromenuzzi.github.io/cloud-infra-blueprint/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cloud Blueprint — Design cloud infrastructure visually. Ship Terraform instantly." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cloud Blueprint — visual Terraform editor" />
    <meta
      name="twitter:description"
      content="Design cloud infrastructure visually, ship Terraform instantly. Free, open source, runs in your browser."
    />
    <meta name="twitter:image" content="https://pedromenuzzi.github.io/cloud-infra-blueprint/og-image.png" />
    <script>
      // Anti-flash: apply theme before React mounts.
      (function () {
        try {
          var t = localStorage.getItem('cb-theme') || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
