name: Deploy to GitHub Pages

# Ships only what passed CI: runs after the "CI" workflow (typecheck, unit,
# build, e2e) succeeds on a push to main, and builds that exact commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same as GitHub's Pages starter: let an in-flight deploy finish; queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the commit CI verified (not whatever main points to now)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Best-effort auto-enable; harmless when Pages is already configured
      # (Settings → Pages → Source: GitHub Actions).
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # manual runs skip the CI gate, so at least run the fast checks
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm typecheck && pnpm test
      - name: Build with Pages base path
        # Pages has no rewrites: 404.html serves deep links (the app renders, but the HTTP status is 404)
        run: |
          VITE_BASE="/${GITHUB_REPOSITORY#*/}/" pnpm build
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
